<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f3f4f7">
<meta name="description" content="Trazo: app de dibujo con pinceles, capas, lápiz con presión, simetría y filtros.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Trazo</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<section class="gallery" id="gallery" aria-label="Mis dibujos">
  <header class="gtop">
    <div class="brand"><img src="icons/icon-192.png" alt="" width="28" height="28"><span>Trazo</span></div>
    <div class="spacer"></div>
    <button class="btn" id="gImport" data-i="folder" type="button"><span class="lbl">Abrir archivo</span></button>
    <button class="btn primary" id="gNew" data-i="plus" type="button"><span class="lbl">Nuevo dibujo</span></button>
  </header>
  <main class="gmain">
    <div class="ghead"><h1>Mis dibujos</h1><span class="gcount" id="gCount"></span></div>
    <div class="ggrid" id="gGrid"></div>
    <div class="gempty" id="gEmpty" hidden>
      <p class="gbig">Aún no tienes dibujos</p>
      <p>Crea un lienzo en blanco, o abre una foto o un boceto para dibujar encima.</p>
      <button class="btn primary" id="gNew2" type="button">Crear mi primer dibujo</button>
    </div>
  </main>
</section>

<div class="app" id="app" hidden>
  <header class="top">
    <button class="ib" id="bGallery" data-i="grid" type="button" title="Mis dibujos" aria-label="Volver a mis dibujos"></button>
    <button class="docname" id="docName" type="button" title="Cambiar el nombre"></button>
    <span class="savestate" id="saveState" aria-live="polite"></span>
    <button class="ib" id="bUndo" data-i="undo" type="button" title="Deshacer (Ctrl+Z)" aria-label="Deshacer" disabled></button>
    <button class="ib" id="bRedo" data-i="redo" type="button" title="Rehacer (Ctrl+Shift+Z)" aria-label="Rehacer" disabled></button>
    <div class="spacer"></div>
    <nav class="menus" aria-label="Menús">
      <button class="tbtn" id="mCanvas" data-i="canvas" type="button"><span>Lienzo</span></button>
      <button class="tbtn" id="mSelect" data-i="selrect" type="button"><span>Selección</span></button>
      <button class="tbtn" id="mFilter" data-i="sparkle" type="button"><span>Filtros</span></button>
      <button class="tbtn" id="mRuler" data-i="ruler" type="button"><span>Regla</span></button>
      <button class="tbtn" id="mView" data-i="fit" type="button"><span>Vista</span></button>
    </nav>
    <button class="ib narrowOnly" id="bMore" data-i="more" type="button" title="Más" aria-label="Más opciones"></button>
    <button class="ib wideOnly" id="bSettings" data-i="gear" type="button" title="Ajustes y lápiz" aria-label="Ajustes"></button>
    <button class="btn primary" id="bExport" data-i="share" type="button" title="Guardar y exportar (Ctrl+S)"><span class="lbl">Guardar</span></button>
    <button class="ib narrowOnly" id="bPanel" data-i="palette" type="button" title="Color, pinceles y capas" aria-label="Color, pinceles y capas"></button>
  </header>

  <nav class="tools" id="tools" aria-label="Herramientas"></nav>

  <main class="stage" id="stage">
    <canvas id="view"></canvas>
    <canvas id="overlay"></canvas>
    <div id="cursor" hidden></div>
    <div id="sizePrev" hidden></div>
    <div id="loupe" hidden></div>
    <div class="optbar float" id="optbar"></div>
    <div class="xfbar float" id="xfbar" hidden></div>
    <div class="quick float" id="quick"></div>
    <div class="zoomPill float" id="zoomPill">
      <button class="ib sm" id="zOut" data-i="minus" type="button" title="Alejar (-)" aria-label="Alejar"></button>
      <button class="zv" id="zVal" type="button" title="Ajustar a la pantalla (0)">100%</button>
      <button class="ib sm" id="zIn" data-i="plus" type="button" title="Acercar (+)" aria-label="Acercar"></button>
      <button class="zv rot" id="zRot" type="button" title="Quitar giro" hidden>0°</button>
      <button class="ib sm narrowOnly" id="bLayersQuick" data-i="layers" type="button" title="Capas" aria-label="Capas"></button>
    </div>
  </main>

  <aside class="panel" id="panel" aria-label="Color, pinceles y capas" data-tab="brush">
    <div class="sheetbar"><span class="grab"></span><button class="ib sm" id="sheetClose" data-i="down" type="button" aria-label="Cerrar panel"></button></div>
    <section class="pcolor" id="pColor" aria-label="Color"></section>
    <div class="ptabs" role="tablist">
      <button type="button" role="tab" data-tab="color" class="narrowOnly">Color</button>
      <button type="button" role="tab" data-tab="brush">Pinceles</button>
      <button type="button" role="tab" data-tab="layers">Capas</button>
    </div>
    <section class="pbody" id="pBrush" aria-label="Pinceles"></section>
    <section class="pbody" id="pLayers" aria-label="Capas"></section>
  </aside>
</div>

<div id="toast" role="status"></div>
<input type="file" id="fileIn" hidden>

<script src="js/core.js"></script>
<script src="js/engine.js"></script>
<script src="js/brush.js"></script>
<script src="js/tools.js"></script>
<script src="js/filters.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/input.js"></script>
<script src="js/app.js"></script>
</body>
</html>
